name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name (leave empty to use app-config.properties)"
        required: false
        default: ""
      application_id:
        description: "Application ID, e.g. com.mycompany.myapp (optional)"
        required: false
        default: ""
      load_mode:
        description: "REMOTE, BUNDLED or HYBRID (optional)"
        required: false
        default: ""
      start_url:
        description: "https:// start URL for REMOTE mode (optional)"
        required: false
        default: ""
      allowed_hosts:
        description: "Comma separated allowed hosts (optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files and configuration
        run: bash scripts/validate-project.sh

  test:
    name: Unit tests
    needs: validate
    runs-on: ubuntu-latest
    env:
      WEBVIEW_APP_NAME: ${{ inputs.app_name }}
      WEBVIEW_APPLICATION_ID: ${{ inputs.application_id }}
      WEBVIEW_LOAD_MODE: ${{ inputs.load_mode }}
      WEBVIEW_START_URL: ${{ inputs.start_url }}
      WEBVIEW_ALLOWED_HOSTS: ${{ inputs.allowed_hosts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Summarize failure
        if: failure()
        run: echo "Unit tests failed. Download the 'unit-test-reports' artifact for details." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build debug APK
    needs: test
    runs-on: ubuntu-latest
    env:
      WEBVIEW_APP_NAME: ${{ inputs.app_name }}
      WEBVIEW_APPLICATION_ID: ${{ inputs.application_id }}
      WEBVIEW_LOAD_MODE: ${{ inputs.load_mode }}
      WEBVIEW_START_URL: ${{ inputs.start_url }}
      WEBVIEW_ALLOWED_HOSTS: ${{ inputs.allowed_hosts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Summarize failure
        if: failure()
        run: echo "APK build failed. Open the 'Assemble debug APK' step log for the Gradle error." >> "$GITHUB_STEP_SUMMARY"
