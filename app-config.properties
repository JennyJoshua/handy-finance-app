# ---------------------------------------------------------------
# WebView template configuration  (edit this file to customize)
# Lines starting with # are comments. Do not put comments after values.
# Any key can also be overridden at build time:
#   ./gradlew assembleDebug -PSTART_URL=https://example.org/
#   or environment variable WEBVIEW_START_URL=https://example.org/
# See docs/WEBVIEW_CONFIGURATION.md for details.
# ---------------------------------------------------------------

# Name shown under the app icon. Max 50 chars. Do not use < > & " ' @ ? % or backslash.
APP_NAME=Handy Finance

# Android application ID (package name of the installed app). Lowercase, dot separated.
APPLICATION_ID=com.jennyjoshua.handyfinance

VERSION_CODE=1
VERSION_NAME=1.0.0

# REMOTE  = load START_URL (must be https)
# BUNDLED = load the website stored in app/src/main/assets/www/
# HYBRID  = bundled frontend that talks to an online backend (see ALLOWED_HOSTS)
LOAD_MODE=REMOTE

# Used in REMOTE mode. Must start with https://
START_URL=https://handygroup.com.pg/finance/

# Page opened first in BUNDLED / HYBRID mode, relative to assets/www/
BUNDLED_ENTRY=index.html

# Comma separated hosts that may open INSIDE the app.
#   example.com      exact host only
#   *.example.com    any subdomain (not example.com itself - list it too)
# REMOTE: empty = host of START_URL.  BUNDLED: ignored.
# HYBRID: backend / login hosts that may be navigated to.
ALLOWED_HOSTS=handygroup.com.pg,www.handygroup.com.pg

# What to do with links to other hosts: BROWSER (open in browser app) or BLOCK
EXTERNAL_LINKS=BROWSER

# Theme color: status bar, splash background, progress bar, icon background
THEME_COLOR=#1C75BC

JAVASCRIPT_ENABLED=true
DOM_STORAGE_ENABLED=true
COOKIES_ENABLED=true
THIRD_PARTY_COOKIES=false
FILE_UPLOADS_ENABLED=true
FILE_DOWNLOADS_ENABLED=true
